# 应用版本描述
application:
  title: 零壹WMS
  version: 1.0.0-SNAPSHOT
  company: 01星球

# 自定义starter配置
zo:
  cloud:
    starter:
      # oauth2 stater 配置
      oauth2:
        # 管理端客户端名称
        mgr-id: wms-manager
        # 管理端客户端密钥
        mgr-password: 123456
        # 用户端客户端名称
        user-id: wms-app
        # 用户端客户端密钥
        user-password: 123456
        # 授权支持类型
        grant-types:
          - password
          - refresh_token
          - authorization_code
          - mobile

spring:
  # 全局jackson配置
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # 上传文件总的最大值
      max-request-size: 20MB
      # 单个文件的最大值
      max-file-size: 10MB
management:
  # 端点检查：ADR-021 复核（2026-11-26）——只暴露健康与信息端点。
  # 原为 include: "*"，会让 /actuator/env、/actuator/heapdump、/actuator/loggers 等敏感端点
  # 在服务端口上直接可读（heapdump 可导出整个堆），属生产阻断，必须收敛。
  endpoints:
    web:
      exposure:
        include: health,info
  # 健康检查
  endpoint:
    health:
      show-details: always
