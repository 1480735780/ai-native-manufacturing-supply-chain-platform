server:
  port: ${sp.sysmgr}
spring:
  application:
#    name: sysmgr
    name: ${sn.sysmgr}
  redis:
    host: ${spring.redis.host}
    port: ${spring.redis.port}
    password: ${spring.redis.password}
seata:
  tx-service-group: tx-business
  # 本地未部署 Seata Server，关闭全局事务，避免查询接口报 No available service
  enabled: false
  service:
  #seata服务地址
    grouplist:
      default: ${seata.default}
      #虚拟组和分组映射，key的名字与tx-service-group一致
    vgroup-mapping:
      tx-business: default
      #开启全局事务
    disable-global-transaction: false
  registry:
    type: nacos
    nacos:
      server-addr: 192.168.89.128:8848
      namespace: public
      group: SEATA_GROUP
easy-es:
  enable: true
  address: ${easy-es.address}
  global-config:
    process-index-mode: manual
  username: ${easy-es.username}