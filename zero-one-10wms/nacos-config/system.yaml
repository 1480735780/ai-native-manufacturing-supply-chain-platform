# ============================================================
# Nacos shared config: system.yaml
# data-id: system.yaml  group: DEFAULT_GROUP
# namespace: 4833404f-4b82-462e-889a-3c508160c6b4
# NOTE: keep this file ASCII-only. The Nacos client on Windows
#       decodes config bytes with the platform default charset
#       (GBK), and the Spring Cloud Alibaba YAML parser then
#       fails with "MalformedInputException" on non-ASCII
#       bytes, which silently empties the whole config source.
# ============================================================

# Service ports (sp.*)
sp:
  doc: 9999
  gateway: 10001
  login: 10200
  auth: 10400
  dashboard: 10010
  sysmgr: 10100
  message: 10210
  notice: 10220
  ws: 10230
  msgmw: 10240
  j3sysmanager: 10310
  daycheck: 10320
  parameterType: 10410
  basezl: 10510
  stockln: 10610
  outgoodsmanage: 10710
  exportmana: 10810
  othermana: 10820
  agent: 11200

# Service names (sn.*), the value registered in Nacos, referenced by gateway/doc routes
sn:
  doc: DOC
  gateway: GATEWAY
  login: LOGIN
  auth: OAUTH2
  sample: SAMPLE
  cpp: CPP
  dashboard: DASHBOARD
  sysmanager: SYSMANAGER
  sysmgr: SYSMGR
  message: MESSAGE
  notice: NOTICE
  ws: WS
  msgmw: MSGMW
  j3sysmanager: J3SYSMANAGER
  daycheck: DAYCHECK
  parameterType: PARAMETER
  basezl: BASEZL
  stockln: STOCKLN
  outgoodsmanage: OUTGOODSMANAGE
  exportmana: EXPORTMANA
  othermana: OTHERMANA

# wms-agent (python service, no nacos registration, static gateway route)
agent:
  url: http://127.0.0.1:11200
