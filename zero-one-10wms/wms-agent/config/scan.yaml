version: "v0.2.1"
warehouses: ["W01"]
scan:
  pageSize: 100
  maxPages: 20
  requestTimeoutSeconds: 3
  sourceBudgetSeconds: 30
  scanBudgetSeconds: 120
  concurrency: 1
rules:
  expiry:
    expiredDays: 0
    nearDays: 7
    nearRatio: 0.3333
    watchDays: 30
  noUp:
    p0Hours: 8
    p1Hours: 4
    p2Hours: 2
  delay:
    p0Hours: 24
    p1Hours: 2
    p2Hours: 0
  backlog:
    growthRatio: 0.30
    absoluteDelta: 10
    baselineScans: 3
    consecutiveForP1: 3
  # v0.2.1 出货异常：24 小时自然时间老化；独立开关，不进默认 schedule.scanTypes。
  # maxPages 默认 50（大于全局 scan.maxPages=20）：候选集是全历史，按 oldest 正序翻页时
  # 最新的差异行在末尾，20 × 100 会漏掉（审计 m01655/m01902）。溢出仍标 partial + SCAN-PARTIAL。
  outbound:
    enabled: true
    p0Hours: 24
    pageSize: 100
    maxPages: 50
  # 开发演示配置（用户 2026-11-26 授权编造）：仅用于当前 dev 验收，不是生产温区标准。
  # 正式 prod 必须由业务重新确认地点、aliases、min/max 与录入间隔后再替换。
  temperature:
    enabled: true
    expectedIntervalHours: 4
    consecutivePoints: 2
    p0AbsC: 2.0
    p0SpanHours: 4.0
    p0SinglePointAbsC: 5.0
    locations:
      - name: "一号冷库"
        aliases: ["1号冷库", "冷库1"]
        min_c: 2.0
        max_c: 8.0
        expected_interval_hours: 4
      - name: "二号冷库"
        aliases: ["2号冷库", "冷库2"]
        min_c: -20.0
        max_c: -15.0
        expected_interval_hours: 4
      - name: "常温库A"
        aliases: ["常温A"]
        min_c: 10.0
        max_c: 25.0
        expected_interval_hours: 8
      - name: "三号冷库"
        aliases: ["3号冷库", "冷库3"]
        min_c: 2.0
        max_c: 8.0
        expected_interval_hours: 4
routing:
  - rule_id: "EXP-*"
    warehouse: "W01"
    assignee_role: "qc_lead"
    recipients: ["admin"]
  - rule_id: "NOUP-OVERDUE"
    warehouse: "W01"
    assignee_role: "putaway_lead"
    recipients: ["admin"]
  - rule_id: "DELAY-OVERDUE"
    warehouse: "W01"
    assignee_role: "receiving_lead"
    recipients: ["admin"]
  - rule_id: "BACKLOG-GROWTH"
    warehouse: "W01"
    assignee_role: "duty_supervisor"
    recipients: ["admin"]
  - rule_id: "OUTBOUND-EXCEPTION"
    warehouse: "W01"
    assignee_role: "qc_lead"
    recipients: ["admin"]
  - rule_id: "TEMP-EXCURSION"
    warehouse: "W01"
    assignee_role: "qc_lead"
    recipients: ["admin"]
notifications:
  mode: "dry_run"
  recipients: ["admin"]
schedule:
  enabled: false
  scanTypes: ["expiry", "no_up", "delay", "backlog"]
  cron: "*/15 7-23 * * *"
  timezone: "Asia/Shanghai"
# LLM 聚合摘要：只负责“怎么说”，不参与“是否异常/级别”的判定。
# 默认关闭 → 全部使用确定性模板摘要。API Key 只走环境变量 WMS_AGENT_LLM_API_KEY，不写在这里。
llm:
  enabled: false
  maxCallsPerScan: 20      # 单次扫描 LLM 调用上限（方案硬边界 ≤20，超出部分用模板）
  timeoutSeconds: 8        # 单次调用超时（≤8）
  concurrency: 4           # 并发调用数
  maxSummaryChars: 300     # 摘要最大字数（≤300）
  maxActions: 3            # 建议动作最多条数（≤3）
  maxActionChars: 100      # 单条建议动作最大字数（≤100）
