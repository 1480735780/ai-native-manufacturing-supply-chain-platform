[project]
name = "wms-agent"
version = "0.1.0"
description = "WMS 问数 Agent 微服务（ADR-001/013/015）"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "cryptography>=42",
    # F-012：trace 持久化（schema wms_agent）；未安装时自动降级为内存存储
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.uv]
# 服务以源码目录方式运行，不构建为可安装包（保持最小面）
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
